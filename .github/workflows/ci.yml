name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests run_eval.py
      - name: Unit tests (offline)
        env:
          RISK_DISABLE_EMBEDDINGS: "1"
        run: pytest -q
      - name: Eval regression gate
        env:
          RISK_DISABLE_EMBEDDINGS: "1"
          EVAL_CRITICAL_RECALL_MIN: "1.0"
        run: python run_eval.py

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pr-risk-analyzer:${{ github.sha }} .
